[project]
name = "previsao"
version = "0.0.1"
description = "Extrai, verifica e redige parecer de previsões orçamentárias de condomínios"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
