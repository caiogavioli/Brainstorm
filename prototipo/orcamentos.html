  const fmtBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const moeda = (centavos) => fmtBRL.format(centavos / 100);

  function paraCampo(centavos) {
    const s = centavos < 0 ? "-" : "";
    const a = Math.abs(centavos);
    return s + Math.trunc(a / 100) + "," + String(a % 100).padStart(2, "0");
  }

  function qtde(milesimos) {
    const inteiro = Math.trunc(milesimos / 1000);
    const resto = Math.abs(milesimos % 1000);
    if (resto === 0) return String(inteiro);
    return inteiro + "," + String(resto).padStart(3, "0").replace(/0+$/, "");
  }

  function lerMoeda(texto) {
    let c = String(texto).replace(/[R$\s ]/gi, "").trim();
    if (c === "") return null;
    const neg = c.startsWith("-");
    if (neg) c = c.slice(1);
    if (!/^[\d.,]+$/.test(c)) return null;
    if (c.includes(",")) {
      c = c.replace(/\./g, "");
      if ((c.match(/,/g) || []).length > 1) return null;
      c = c.replace(",", ".");
    } else {
      const p = c.split(".");
      if (p.length > 1) {
        if (p.slice(1).every((x) => /^\d{3}$/.test(x))) c = p.join("");
        else if (p.length > 2) return null;
      }
    }
    const n = Number(c);
    if (!Number.isFinite(n)) return null;
    return (neg ? -1 : 1) * Math.round(n * 100);
  }

    const c = String(texto).replace(/\s/g, "").replace(",", ".");

    const n = Number(c);

      .reduce((a, o) => ({ n: a.n + 1, v: a.v + total(o) }), { n: 0, v: 0 });

    const ganho = soma(["ACEITO"]);

  // =====================================================================
  // Tela: editor (novo / editar)
  // =====================================================================
  let editor = null;

  function abrirEditor(id) {
    if (id) {
      const o = db.orcamentos.find((x) => x.id === id);
      editor = {
        id: o.id, clienteId: o.clienteId, titulo: o.titulo,
        condicoes: o.condicoes || "", prazo: o.prazo || "", observacoes: o.observacoes || "",
        desconto: paraCampo(o.desconto || 0), validade: "30",
        itens: o.itens.map((i) => ({ servicoId: 0, descricao: i.descricao, unidade: i.unidade, q: qtde(i.q), v: paraCampo(i.v) })),
      };
    } else {
      editor = {
        id: null, clienteId: 0, titulo: "", condicoes: "", prazo: "", observacoes: "",
        desconto: "", validade: "15",
        itens: [{ servicoId: 0, descricao: "", unidade: "un", q: "1", v: "" }],
      };
    }
  }

  function totaisEditor() {
    const linhas = editor.itens.map((i) => {
      const q = lerQtde(i.q), v = lerMoeda(i.v);
      return q === null || v === null ? null : totalLinha(q, v);
    });
    const sub = linhas.reduce((s, t) => s + (t || 0), 0);
    const desc = Math.min(Math.max(lerMoeda(editor.desconto) || 0, 0), sub);
    return { linhas, sub, desc, total: sub - desc, incompleta: linhas.some((t) => t === null) };
  }

                <div><div class="titulo-secao">Histórico</div><div class="num">${meus.length} orçamento(s) · ${ganhos.length} aceito(s)</div></div>
              </div>
              <div class="linha" style="gap:1rem;border-top:1px solid var(--borda);margin-top:.75rem;padding-top:.75rem">
                <button class="ligacao">Editar</button>
                <button class="ligacao" style="color:var(--tinta-2)">${c.ativo ? "Desativar" : "Reativar"}</button>
                ${meus.length === 0
                  ? `<button class="ligacao" style="color:var(--status-critico-texto)">Excluir</button>`
                  : `<span class="mini num fraco">tem histórico — desative em vez de excluir</span>`}
              </div>
            </div>`;
          }).join("")}
        </div>

        <aside>
          <div class="card card-pad">
            <h2 style="margin-bottom:.75rem">Cadastrar cliente</h2>
            <div class="campos">
              <div><label class="rotulo" for="c-nome">Nome / Razão social</label><input id="c-nome" class="campo"></div>
              <div><label class="rotulo" for="c-contato">Pessoa de contato</label><input id="c-contato" class="campo" placeholder="Quem lê e assina"></div>
              <div>
                <label class="rotulo" for="c-email">E-mail <span style="color:var(--status-critico-texto)">*</span></label>
                <input id="c-email" class="campo" type="email">
                <p class="mini fraco" style="margin:.25rem 0 0">É para cá que o orçamento vai. Por isso é o único campo obrigatório além do nome.</p>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                <div><label class="rotulo" for="c-tel">Telefone</label><input id="c-tel" class="campo"></div>
                <div><label class="rotulo" for="c-doc">CNPJ / CPF</label><input id="c-doc" class="campo"></div>
              </div>
              <button class="botao botao-primario" style="width:100%" data-acao="demo">Cadastrar cliente</button>
            </div>
          </div>
        </aside>
      </div>
    `);
  }

  // =====================================================================
  // Tela: catálogo e modelos
  // =====================================================================
  function telaCatalogo() {
    const categorias = [...new Set(db.servicos.map((s) => s.categoria))].sort();

    return casca("catalogo", `
      <h1>Catálogo e modelos</h1>
      <p class="sub" style="margin-bottom:1rem">O <strong>catálogo</strong> guarda cada serviço que você vende, com descrição e preço. O <strong>modelo</strong> junta vários deles num orçamento pronto. É o que faz dois orçamentos do mesmo tipo saírem iguais.</p>

      <div class="colunas">
        <div class="pilha">
          <section>
            <h2 style="margin-bottom:.5rem">Serviços do catálogo</h2>
            <div class="pilha" style="gap:1rem">
              ${categorias.map((cat) => `
                <div>
                  <h3 class="titulo-secao" style="margin-bottom:.5rem">${esc(cat)}</h3>
                  <div class="pilha-fina">
                    ${db.servicos.filter((s) => s.categoria === cat).map((s) => `
                      <div class="card card-pad">
                        <div class="entre">
                          <div class="crescer">
                            <div style="font-weight:600">${esc(s.nome)}</div>
                            <p class="mini" style="margin:.125rem 0 0;color:var(--tinta-2)">${esc(s.descricao)}</p>
                            <p class="mini num fraco" style="margin:.25rem 0 0">${esc(s.codigo)}</p>
                          </div>
                          <div class="direita" style="flex:none">
                            <div class="num" style="font-weight:600">${moeda(s.valor)}</div>
                            <div class="mini fraco">por ${esc(s.unidade)}</div>
                            ${!s.ativo ? `<span class="badge badge-neutral" style="margin-top:.25rem">Inativo</span>` : ""}
                          </div>
                        </div>
                        <div class="linha" style="gap:1rem;border-top:1px solid var(--borda);margin-top:.75rem;padding-top:.75rem">
                          <button class="ligacao">Editar</button>
                          <button class="ligacao" style="color:var(--tinta-2)">${s.ativo ? "Desativar" : "Reativar"}</button>
                          ${s.usos === 0
                            ? `<button class="ligacao" style="color:var(--status-critico-texto)">Excluir</button>`
                            : `<span class="mini num fraco">usado em ${s.usos} modelo(s)</span>`}
                        </div>
                      </div>`).join("")}
                  </div>
                </div>`).join("")}
            </div>
          </section>

          <section>
            <h2 style="margin-bottom:.5rem">Modelos de orçamento</h2>
            <div class="pilha-fina">
              <button class="botao botao-primario" style="align-self:flex-start" data-acao="demo">+ Novo modelo</button>
              ${db.modelos.map((m) => {
                const t = m.itens.reduce((s, i) => s + totalLinha(i.q, i.v), 0);
                return `
                <div class="card card-pad">
                  <div class="entre">
                    <div class="crescer">
                      <div style="font-weight:600">${esc(m.nome)}</div>
                      <p class="mini" style="margin:.125rem 0 0;color:var(--tinta-2)">${esc(m.descricao)}</p>
                      <p class="mini num fraco" style="margin:.25rem 0 0">${m.itens.length} item(ns) · validade de ${m.validade} dia(s)</p>
                    </div>
                    <div class="direita" style="flex:none">
                      <div class="num" style="font-weight:600">${moeda(t)}</div>
                    </div>
                  </div>
                  <ul class="pequeno" style="margin:.75rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.25rem;color:var(--tinta-2)">
                    ${m.itens.map((i) => `
                      <li class="entre" style="flex-wrap:nowrap;gap:.75rem">
                        <span class="crescer" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                          <span class="num">${qtde(i.q)} ${esc(i.unidade)}</span> · ${esc(i.descricao)}
                        </span>
                        <span class="num" style="flex:none">${moeda(totalLinha(i.q, i.v))}</span>
                      </li>`).join("")}
                  </ul>
                  <div class="linha" style="gap:1rem;border-top:1px solid var(--borda);margin-top:.75rem;padding-top:.75rem">
                    <button class="ligacao">Editar</button>
                    <button class="ligacao" style="color:var(--tinta-2)">Desativar</button>
                    <button class="ligacao" style="color:var(--status-critico-texto)">Excluir</button>
                  </div>
                </div>`;
              }).join("")}
            </div>
          </section>
        </div>

        <aside>
          <div class="card card-pad">
            <h2 style="margin-bottom:.75rem">Novo serviço</h2>
            <div class="campos">
              <div><label class="rotulo" for="s-nome">Nome do serviço</label><input id="s-nome" class="campo" placeholder="Limpeza de caixa d'água"></div>
              <div><label class="rotulo" for="s-desc">Descrição</label><textarea id="s-desc" class="campo" rows="2" placeholder="O texto que vai aparecer no orçamento"></textarea></div>
              <div><label class="rotulo" for="s-cat">Categoria</label><input id="s-cat" class="campo" list="cats" placeholder="Geral"><datalist id="cats">${categorias.map((c) => `<option value="${esc(c)}"></option>`).join("")}</datalist></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                <div><label class="rotulo" for="s-un">Unidade</label><input id="s-un" class="campo" placeholder="un"></div>
                <div><label class="rotulo" for="s-val">Valor padrão (R$)</label><input id="s-val" class="campo num" inputmode="decimal" placeholder="0,00"></div>
              </div>
              <button class="botao botao-primario" style="width:100%" data-acao="demo">Adicionar ao catálogo</button>
            </div>
          </div>
        </aside>
      </div>
    `);
  }

  // =====================================================================
  // Render + eventos
  // =====================================================================
  function render() {
    const partes = (location.hash.replace(/^#\/?/, "") || "orcamentos").split("/");
    const [rota, arg] = partes;

    if (rota === "novo") { if (!editor || editor.id) abrirEditor(null); app.innerHTML = telaEditor(); }
    else if (rota === "editar") { if (!editor || editor.id !== Number(arg)) abrirEditor(Number(arg)); app.innerHTML = telaEditor(); }
    else if (rota === "orcamento") { editor = null; app.innerHTML = telaOrcamento(Number(arg)); }
    else if (rota === "enviar") { editor = null; app.innerHTML = telaEnviar(Number(arg)); }
    else if (rota === "o") { editor = null; app.innerHTML = telaCliente(arg); }
    else if (rota === "clientes") { editor = null; app.innerHTML = telaClientes(); }
    else if (rota === "catalogo") { editor = null; app.innerHTML = telaCatalogo(); }
    else { editor = null; app.innerHTML = telaPainel(); }

    window.scrollTo(0, 0);
  }

  // Redesenha só a área principal, preservando o foco e a posição do cursor —
  // sem isso, digitar num campo do editor perderia o foco a cada tecla.
  function redesenharEditor() {
    const ativo = document.activeElement;
    const id = ativo && ativo.id;
    const pos = ativo && ativo.selectionStart;
    app.innerHTML = telaEditor();
    if (id) {
      const novo = document.getElementById(id);
      if (novo) {
        novo.focus();
        if (pos != null && novo.setSelectionRange) {
          try { novo.setSelectionRange(pos, pos); } catch { /* select não aceita */ }
        }
      }
    }
  }

  // ---- entrada de texto ----
  app.addEventListener("input", (ev) => {
    const el = ev.target;

    if (el.dataset.campo && editor) {
      editor[el.dataset.campo] = el.dataset.campo === "clienteId" ? Number(el.value) : el.value;
      if (el.dataset.campo === "desconto") redesenharEditor();
      return;
    }
    if (el.dataset.item && editor) {
      editor.itens[Number(el.dataset.i)][el.dataset.item] = el.value;
      if (el.dataset.item === "q" || el.dataset.item === "v") redesenharEditor();
      return;
    }
    if (el.id === "f-status") { filtro.status = el.value; render(); return; }
    if (el.id === "f-cliente") { filtro.cliente = el.value; render(); return; }
  });

  // ---- selects de ação ----
  app.addEventListener("change", (ev) => {
    const el = ev.target;

    if (el.dataset.acao === "servico" && editor) {
      const s = db.servicos.find((x) => x.id === Number(el.value));
      const linha = editor.itens[Number(el.dataset.i)];
      if (s) {
        // Copia do catálogo, não referencia: reajustar um preço amanhã não pode
        // reescrever um orçamento que o cliente já recebeu.
        linha.servicoId = s.id;
        linha.descricao = s.descricao || s.nome;
        linha.unidade = s.unidade;
        linha.v = paraCampo(s.valor);
      } else {
        linha.servicoId = 0;
      }
      redesenharEditor();
      return;
    }

    if (el.dataset.acao === "modelo" && editor) {
      const m = db.modelos.find((x) => x.id === Number(el.value));
      el.value = "0";
      if (!m) return;
      const tem = editor.itens.some((i) => i.descricao.trim() || i.v.trim()) || editor.condicoes.trim();
      if (tem && !confirm("Aplicar o modelo substitui os itens e os textos já preenchidos. Continuar?")) return;
      editor.itens = m.itens.map((i) => ({ servicoId: i.servicoId, descricao: i.descricao, unidade: i.unidade, q: qtde(i.q), v: paraCampo(i.v) }));
      editor.condicoes = m.condicoes;
      editor.prazo = m.prazo;
      editor.observacoes = m.observacoes;
      editor.validade = String(m.validade);
      redesenharEditor();
      return;
    }

    if (el.dataset.acao === "pendencia") {
      const o = db.orcamentos.find((x) => x.id === Number(el.dataset.id));
      o.pendencias[Number(el.dataset.i)].feito = el.checked;
      gravar();
      render();
    }
  });

  // ---- cliques ----
  app.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-acao]");
    if (!btn) return;
    const acao = btn.dataset.acao;

    if (acao === "demo") {
      ev.preventDefault();
      alert("No protótipo este formulário é só demonstração. No sistema real ele grava no banco.");
      return;
    }

    if (acao === "pdf") {
      ev.preventDefault();
      alert("No sistema real, aqui abre o PDF gerado pelo servidor — o mesmo arquivo que vai anexado ao e-mail.");
      return;
    }

    if (acao === "adicionar" && editor) {
      editor.itens.push({ servicoId: 0, descricao: "", unidade: "un", q: "1", v: "" });
      redesenharEditor(); return;
    }

    if (acao === "remover" && editor) {
      const i = Number(btn.dataset.i);
      if (editor.itens.length === 1) editor.itens = [{ servicoId: 0, descricao: "", unidade: "un", q: "1", v: "" }];
      else editor.itens.splice(i, 1);
      redesenharEditor(); return;
    }

    if (acao === "mover" && editor) {
      const i = Number(btn.dataset.i), d = Number(btn.dataset.dir), j = i + d;
      if (j < 0 || j >= editor.itens.length) return;
      [editor.itens[i], editor.itens[j]] = [editor.itens[j], editor.itens[i]];
      redesenharEditor(); return;
    }

    if (acao === "salvar" && editor) {
      if (!editor.clienteId) { alert("Selecione o cliente."); return; }
      if (editor.titulo.trim().length < 3) { alert("Dê um título ao orçamento."); return; }
      const itens = editor.itens
        .map((i) => ({ descricao: i.descricao.trim(), unidade: i.unidade.trim() || "un", q: lerQtde(i.q), v: lerMoeda(i.v) }))
        .filter((i) => i.descricao && i.q && i.v !== null);
      if (itens.length === 0) { alert("O orçamento precisa de ao menos um item com descrição, quantidade e valor."); return; }

      const t = totaisEditor();
      if (editor.id) {
        const o = db.orcamentos.find((x) => x.id === editor.id);
        Object.assign(o, {
          clienteId: editor.clienteId, titulo: editor.titulo.trim(), itens,
          condicoes: editor.condicoes, prazo: editor.prazo, observacoes: editor.observacoes,
          desconto: t.desc,
        });
        gravar(); editor = null; location.hash = "#/orcamento/" + o.id;
      } else {
        const ano = new Date().getFullYear();
        const usados = db.orcamentos.map((o) => Number(o.numero.slice(5))).filter((n) => !isNaN(n));
        const seq = (usados.length ? Math.max(...usados) : 0) + 1;
        const novo = {
          id: Math.max(0, ...db.orcamentos.map((o) => o.id)) + 1,
          numero: ano + "-" + String(seq).padStart(4, "0"), versao: 1,
          clienteId: editor.clienteId, titulo: editor.titulo.trim(), status: "RASCUNHO",
          criadoEm: new Date().toISOString(),
          validoAte: new Date(Date.now() + Number(editor.validade || 15) * 864e5).toISOString().slice(0, 10),
          enviadoEm: null, visualizadoEm: null, visualizacoes: 0, respondidoEm: null, resposta: null,
          condicoes: editor.condicoes, prazo: editor.prazo, observacoes: editor.observacoes,
          desconto: t.desc, token: novoToken(), itens, pendencias: [],
        };
        db.orcamentos.push(novo);
        gravar(); editor = null; location.hash = "#/orcamento/" + novo.id;
      }
      return;
    }

    if (acao === "confirmar-envio") {
      const o = db.orcamentos.find((x) => x.id === Number(btn.dataset.id));
      o.status = "ENVIADO";
      o.enviadoEm = new Date().toISOString();
      gravar();
      alert("No protótipo nada é enviado.\n\nNo sistema real, aqui o e-mail sai pela sua caixa do Outlook e o disparo fica registrado com data, destinatário e resultado.");
      location.hash = "#/orcamento/" + o.id;
      return;
    }

    if (acao === "responder") {
      const o = db.orcamentos.find((x) => x.id === Number(btn.dataset.id));
      const msg = document.getElementById("resp-msg");
      o.status = btn.dataset.r;
      o.respondidoEm = new Date().toISOString();
      o.resposta = msg && msg.value.trim() ? msg.value.trim() : null;
      if (!o.visualizadoEm) { o.visualizadoEm = new Date().toISOString(); }
      o.visualizacoes += 1;
      if (o.status === "AJUSTE_SOLICITADO" && o.resposta) {
        o.pendencias.push({ texto: "Responder ao pedido: " + o.resposta.slice(0, 60), prazo: new Date(Date.now() + 3 * 864e5).toISOString().slice(0, 10), feito: false });
      }
      gravar(); render();
      return;
    }

    if (acao === "refazer") {
      const o = db.orcamentos.find((x) => x.id === Number(btn.dataset.id));
      o.status = "VISUALIZADO"; o.respondidoEm = null; o.resposta = null;
      gravar(); render();
      return;
    }

    if (acao === "nova-versao") {
      const o = db.orcamentos.find((x) => x.id === Number(btn.dataset.id));
      o.versao += 1; o.status = "RASCUNHO";
      o.enviadoEm = null; o.visualizadoEm = null; o.visualizacoes = 0;
      o.respondidoEm = null; o.resposta = null; o.token = novoToken();
      gravar();
      alert("Versão " + o.versao + " criada como rascunho.\n\nO histórico da versão anterior fica na linha do tempo — é assim que a fase 4 vai tratar um pedido de ajuste.");
      render();
      return;
    }
  });

  function novoToken() {
    const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
    const bytes = new Uint8Array(43);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, (b) => alfabeto[b % 64]).join("");
  }

  document.getElementById("reiniciar").addEventListener("click", () => {
    if (!confirm("Voltar os dados de exemplo ao estado inicial?")) return;
    db = inicial();
    gravar();
    editor = null;
    filtro = { status: "", cliente: "" };
    render();
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
