# Sobe o sistema inteiro — aplicação e banco de dados — com um comando:
#
#   docker compose up -d
#
# Depois acesse http://localhost:3000. Nada precisa ser instalado além do
# Docker: nem Node, nem PostgreSQL.

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condominios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: condominios
    volumes:
      # Os dados vivem aqui. Enquanto este volume existir, nada se perde —
      # nem ao recriar o container, nem ao atualizar a aplicação.
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominios -d condominios"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://condominios:${POSTGRES_PASSWORD:-troque-esta-senha}@banco:5432/condominios?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no arquivo .env}
      # Preenchidos no primeiro start para criar o administrador.
      # Depois de criado, pode remover as duas linhas do .env.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      TZ: America/Sao_Paulo
    ports:
      - "${PORTA:-3000}:3000"

volumes:
  dados-postgres:
